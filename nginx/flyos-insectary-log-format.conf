# Included by /etc/nginx/nginx.conf inside the http {} context.
# Cookie metadata is supplied by the loopback-only Node metadata proxy.
map $http_cookie $has_cookie {
    ""      0;
    default 1;
}

map $http_authorization $has_authorization {
    ""      0;
    default 1;
}

map $http_cf_connecting_ip $ip_resolution {
    ""      "direct_or_header_absent";
    default "trusted_cloudflare_tunnel_header";
}

log_format insectary_json escape=json
  '{'
    '"time":"$time_iso8601",'
    '"client_ip":"$remote_addr",'
    '"client_port":"$remote_port",'
    '"proxy_peer_ip":"$realip_remote_addr",'
    '"proxy_peer_port":"$realip_remote_port",'
    '"ip_resolution":"$ip_resolution",'
    '"cf_connecting_ip_header":"$http_cf_connecting_ip",'
    '"x_forwarded_for_header":"$http_x_forwarded_for",'
    '"cf_ray":"$http_cf_ray",'
    '"method":"$request_method",'
    '"request":"$request",'
    '"uri":"$uri",'
    '"host":"$host",'
    '"scheme":"$scheme",'
    '"protocol":"$server_protocol",'
    '"status":$status,'
    '"user_agent":"$http_user_agent",'
    '"referer":"$http_referer",'
    '"accept_language":"$http_accept_language",'
    '"accept":"$http_accept",'
    '"accept_encoding":"$http_accept_encoding",'
    '"content_type":"$http_content_type",'
    '"content_length":"$http_content_length",'
    '"origin":"$http_origin",'
    '"sec_ch_ua":"$http_sec_ch_ua",'
    '"sec_ch_ua_platform":"$http_sec_ch_ua_platform",'
    '"sec_ch_ua_mobile":"$http_sec_ch_ua_mobile",'
    '"sec_fetch_site":"$http_sec_fetch_site",'
    '"sec_fetch_mode":"$http_sec_fetch_mode",'
    '"sec_fetch_dest":"$http_sec_fetch_dest",'
    '"has_cookie":$http_x_insectary_has_cookie,'
    '"cookie_header_bytes":$http_x_insectary_cookie_header_bytes,'
    '"cookie_count":$http_x_insectary_cookie_count,'
    '"cookie_names":"$http_x_insectary_cookie_names",'
    '"cookie_fingerprint":"$http_x_insectary_cookie_fingerprint",'
    '"has_authorization":$http_x_insectary_has_authorization,'
    '"ssl_protocol":"$ssl_protocol",'
    '"ssl_cipher":"$ssl_cipher",'
    '"request_length":$request_length,'
    '"request_time":$request_time,'
    '"bytes_sent":$bytes_sent,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_id":"$request_id"'
  '}';
