<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Three layers of crawler control</title><desc id="desc">A green line diagram on black showing published instructions, server access, and search visibility as separate layers.</desc><rect width="1200" height="520" fill="#000"/><g fill="none" stroke="#61cf5a" stroke-width="5"><rect x="95" y="110" width="270" height="300" rx="18"/><rect x="465" y="110" width="270" height="300" rx="18"/><rect x="835" y="110" width="270" height="300" rx="18"/><path d="M365 260h100m-25-20 25 20-25 20m270 0h100m-25-20 25 20-25 20"/></g><g fill="#61cf5a" font-family="Arial, sans-serif" text-anchor="middle"><text x="230" y="205" font-size="30">robots.txt</text><text x="230" y="258" font-size="22">published request</text><text x="600" y="205" font-size="30">server rules</text><text x="600" y="258" font-size="22">technical enforcement</text><text x="970" y="205" font-size="30">search use</text><text x="970" y="258" font-size="22">separate decision</text></g></svg>
