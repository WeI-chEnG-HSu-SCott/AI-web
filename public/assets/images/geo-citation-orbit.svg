<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">A generated answer can cite sources without sending a click</title><desc id="desc">A vivid blue and cyan orbital diagram on black with an answer at the centre, source citations, and a separate click path.</desc><rect width="1200" height="520" fill="#000"/><g fill="none" stroke="#97e6ff" stroke-width="5"><circle cx="600" cy="260" r="92" stroke="#0afefe"/><ellipse cx="600" cy="260" rx="300" ry="135"/><circle cx="300" cy="260" r="36" stroke="#1645f7"/><circle cx="900" cy="260" r="36" stroke="#1645f7"/><path d="M600 168v-88m0 360v-88M600 80l-18 26m18-26 18 26M600 440l-18-26m18 26 18-26"/></g><g fill="#97e6ff" font-family="Arial, sans-serif" text-anchor="middle"><text x="600" y="252" font-size="28">generated</text><text x="600" y="288" font-size="28">answer</text><text x="300" y="270" font-size="20">source</text><text x="900" y="270" font-size="20">source</text><text x="600" y="64" font-size="22">citation</text><text x="600" y="478" font-size="22">click may not follow</text></g></svg>
