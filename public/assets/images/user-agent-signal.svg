<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">A User-Agent is a self-described signal, not an identity card</title><desc id="desc">A green line diagram on black showing a request header reaching a server, with labels for self-description and uncertainty.</desc><rect width="1200" height="520" fill="#000"/><g fill="none" stroke="#61cf5a" stroke-width="5" stroke-linecap="round"><rect x="80" y="130" width="350" height="260" rx="18"/><path d="M430 260h230m-25-20 25 20-25 20"/><rect x="660" y="130" width="220" height="260" rx="18"/><path d="M880 260h140m-25-20 25 20-25 20"/><circle cx="1085" cy="260" r="78"/><path d="M1055 290l60-60M1055 230l60 60"/></g><g fill="#61cf5a" font-family="Arial, sans-serif" text-anchor="middle"><text x="255" y="230" font-size="27">User-Agent:</text><text x="255" y="280" font-size="22">self-described client</text><text x="770" y="245" font-size="28">server log</text><text x="1085" y="375" font-size="25">not proof of identity</text></g></svg>
