<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Four common HTTP response codes</title><desc id="desc">A green line diagram on black showing four status code cards for 200, 301, 404, and 503.</desc><rect width="1200" height="520" fill="#000"/><g fill="none" stroke="#61cf5a" stroke-width="5"><rect x="65" y="120" width="230" height="270" rx="18"/><rect x="335" y="120" width="230" height="270" rx="18"/><rect x="605" y="120" width="230" height="270" rx="18"/><rect x="875" y="120" width="230" height="270" rx="18"/></g><g fill="#61cf5a" font-family="Arial, sans-serif" text-anchor="middle"><text x="180" y="225" font-size="60">200</text><text x="180" y="290" font-size="27">OK</text><text x="450" y="225" font-size="60">301</text><text x="450" y="290" font-size="27">moved</text><text x="720" y="225" font-size="60">404</text><text x="720" y="290" font-size="27">not found</text><text x="990" y="225" font-size="60">503</text><text x="990" y="290" font-size="27">unavailable</text></g></svg>
