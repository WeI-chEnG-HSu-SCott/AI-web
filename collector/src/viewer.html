<!doctype html><meta charset="utf-8"><title>Local event viewer</title><style>body{font:16px system-ui;margin:2rem;background:#101614;color:#e9f2ed}li{padding:.5rem;border-bottom:1px solid #354}.ok{color:#7ee2a8}.bad{color:#ff9b8e}</style><h1>Local SSE event viewer</h1><p id="state">Connecting…</p><ol id="events"></ol><script>const state=document.querySelector('#state'),list=document.querySelector('#events');const es=new EventSource('/events');es.onopen=()=>{state.textContent='Connected to local collector';state.className='ok'};es.onerror=()=>{state.textContent='Disconnected; EventSource will retry';state.className='bad'};es.addEventListener('visit',e=>{const item=document.createElement('li');try{const x=JSON.parse(e.data),ip=x.client_ip||'unavailable';item.textContent=`${x.timestamp} · ${x.method} ${x.path} · ${x.status} · ${x.bot_family} · client IP: ${ip} (${x.ip_resolution||'unverified'})`;}catch{item.textContent='Malformed event ignored';}list.prepend(item);while(list.children.length>50)list.lastElementChild.remove();});</script>
